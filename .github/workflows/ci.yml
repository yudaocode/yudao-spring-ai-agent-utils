name: CI

on:
  pull_request: {}

jobs:
  build:
    name: Build branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 8 for tests
        uses: actions/setup-java@v4
        id: jdk8
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build
        run: ./mvnw verify -Dcompat.test.jvm="${{ steps.jdk8.outputs.path }}/bin/java"
